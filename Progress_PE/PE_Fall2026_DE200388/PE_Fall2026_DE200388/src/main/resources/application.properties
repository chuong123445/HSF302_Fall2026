spring.application.name=PE_Fall2026_DE200388
spring.datasource.url=jdbc:sqlserver://localhost:1143;databaseName=HSF302_PE_SDM;encrypt=false;trustServerCertificate=true

spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Table/column names are managed manually via sql/create_tables.sql, so ddl-auto must stay "none"
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false